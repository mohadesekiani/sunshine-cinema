<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">ورود</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- شماره موبایل -->
    <div class="mb-4">
      <label for="mobile" class="block text-sm font-medium text-gray-700"
        >شماره موبایل</label
      >
      <input
        id="mobile"
        type="text"
        formControlName="mobile"
        placeholder="09"
        class="mt-1 block w-full border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
      />
      <small
        *ngIf="
          loginForm.get('mobile')?.invalid && loginForm.get('mobile')?.touched
        "
        class="text-red-500"
      >
        شماره موبایل معتبر وارد کنید.
      </small>
    </div>

    <!-- رمز عبور -->
    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700"
        >رمز عبور</label
      >
      <input
        id="password"
        type="password"
        formControlName="password"
        class="mt-1 block w-full border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
      />
      <small
        *ngIf="
          loginForm.get('password')?.invalid &&
          loginForm.get('password')?.touched
        "
        class="text-red-500"
      >
        رمز عبور الزامی است.
      </small>
    </div>

    <!-- دکمه ورود -->
    <button
      type="submit"
      [disabled]="loginForm.invalid"
      class="w-full bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700 transition"
    >
      ورود
    </button>
  </form>
</div>
