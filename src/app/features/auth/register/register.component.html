<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-md">
  <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">ثبت‌نام</h2>
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    <!-- نام کاربری -->
    <div class="mb-4">
      <label for="username" class="block text-sm font-medium text-gray-700"
        >نام کاربری</label
      >
      <input
        id="username"
        type="text"
        formControlName="username"
        class="mt-1 block w-full border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
      />
      <small
        *ngIf="
          signupForm.get('username')?.invalid &&
          signupForm.get('username')?.touched
        "
        class="text-red-500"
      >
        نام کاربری الزامی است.
      </small>
    </div>

    <!-- شماره موبایل -->
    <div class="mb-4">
      <label for="mobile" class="block text-sm font-medium text-gray-700"
        >شماره موبایل</label
      >
      <input
        id="mobile"
        type="text"
        formControlName="mobile"
        class="mt-1 block w-full border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
        (input)="onMobileInput($event)"
        (keypress)="alowOnlyNumber($event)"
      />
      <ng-container
        *ngIf="signupForm.get('mobile')?.touched"
        class="text-red-500"
        >شماره موبایل معتبر وارد کنید.
      </ng-container>
    </div>

    <!-- رمز عبور -->
    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700"
        >رمز عبور</label
      >
      <input
        id="password"
        type="password"
        formControlName="password"
        class="mt-1 block w-full border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500"
      />
      <small
        *ngIf="
          signupForm.get('password')?.invalid &&
          signupForm.get('password')?.touched
        "
        class="text-red-500"
      >
        رمز عبور باید حداقل 6 کاراکتر باشد.
      </small>
    </div>

    <!-- دکمه ثبت‌نام -->
    <button
      type="submit"
      [disabled]="signupForm.invalid"
      class="w-full bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700 transition"
    >
      ثبت‌نام
    </button>
  </form>

  <!-- لینک به صفحه ورود -->
  <div class="mt-4 text-center">
    <span class="text-sm text-gray-600">قبلاً ثبت‌نام کرده‌اید؟</span>
    <a routerLink="/auth/login" class="text-sm text-red-600 hover:underline"
      >ورود</a
    >
  </div>
</div>
